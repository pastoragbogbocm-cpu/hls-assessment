name: Build HLS ASSESSMENT APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip the project and build the APK
        run: |
          unzip -q -o HLS-ASSESSMENT-Android.zip
          cd HLS-ASSESSMENT-Android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: HLS-ASSESSMENT-APK
          path: HLS-ASSESSMENT-Android/app/build/outputs/apk/release/*.apk
